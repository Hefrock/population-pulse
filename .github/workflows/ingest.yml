name: Daily Ingestion

on:
  schedule:
    # 6 AM UTC = 2 AM ET — runs after midnight, before business hours
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date (ISO, e.g. 2025-01-01). Defaults to 365 days ago.'
        required: false
      end:
        description: 'End date (ISO, e.g. 2025-03-31). Defaults to today.'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt
        name: Install dependencies

      - run: pytest tests/ -v
        name: Run tests

  ingest:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write   # needed to push to the data branch

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can checkout/create the data branch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt
        name: Install dependencies

      - name: Run ingestion pipeline
        env:
          MBTA_API_KEY: ${{ secrets.MBTA_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
            python -m src.ingestion.run \
              --city boston \
              --start "${{ github.event.inputs.start }}" \
              --end "${{ github.event.inputs.end }}"
          else
            python -m src.ingestion.run --city boston
          fi

      - name: Push Parquet files to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot generated files before switching branches
          SNAP=/tmp/parquet-snapshot
          mkdir -p "$SNAP"
          cp data/boston/*.parquet "$SNAP/" 2>/dev/null \
            || { echo "No Parquet files generated — skipping data branch push"; exit 0; }

          # Switch to (or create) the data branch.
          # Use -B + explicit start point to avoid ambiguity with the local
          # data/ directory, which causes bare `git checkout data` to fail.
          if git ls-remote --exit-code --heads origin data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . --quiet 2>/dev/null || true
          fi

          # Copy fresh data and commit
          mkdir -p data/boston
          cp "$SNAP"/*.parquet data/boston/

          # -f overrides .gitignore which excludes *.parquet on the main branch
          git add -f data/boston/
          if git diff --staged --quiet; then
            echo "Data unchanged — nothing to push"
          else
            git commit -m "chore: update ingested data $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push origin HEAD:data
          fi
