# Boston configuration for population-pulse.
#
# This file is the single place where Boston-specific facts live. To add another
# city later, copy this file (e.g. cities/chicago.yaml), fill in that city's
# equivalents, and write a matching provider in src/providers/. No pipeline code
# should need to change.

city:
  name: Boston
  slug: boston
  timezone: America/New_York
  # Rough centroid, used for weather lookups and map centering.
  latitude: 42.3601
  longitude: -71.0589

# --- Population-flow signals -------------------------------------------------

transit:
  provider: mbta
  # MBTA V3 API. Key is free from https://api-v3.mbta.com/ — set MBTA_API_KEY
  # in your environment / .env file. The base URL is here; the key is NOT
  # (never commit secrets). The V3 API only exposes a real-time snapshot, so
  # it is now a fallback; the primary transit signal is historical ridership.
  base_url: https://api-v3.mbta.com

  # Primary signal: MBTA "Gated Station Entries" (fare-gate taps), published on
  # the MBTA/MassDOT ArcGIS open-data portal. Daily counts by station/line from
  # 2014 to present, no API key. This is a real historical series that can be
  # correlated against the year of weekly hospital data.
  #
  # The fetcher resolves the live FeatureServer URL from this stable item id and
  # auto-discovers the date/count/line field names, so it survives schema
  # changes. Pin the *_field overrides only if auto-discovery guesses wrong.
  historical:
    arcgis_item_id: 7859894afb5641ce91a2bb03599fdf5b
    # service_url:  https://services1.arcgis.com/.../FeatureServer  # optional override
    # date_field:   service_date
    # count_field:  gated_entries
    # line_field:   route_or_line

  # Subway lines are the cleanest ingress/egress proxy for the dense core.
  routes:
    - Red
    - Orange
    - Blue
    - Green-B
    - Green-C
    - Green-D
    - Green-E
  # Stations near major venues — useful for event-impact analysis later.
  venue_stations:
    td_garden: place-north        # North Station (Celtics, Bruins, concerts)
    fenway: place-kencl           # Kenmore (Red Sox, Fenway concerts)
    bcec: place-wtcst             # World Trade Center (conventions)

weather:
  provider: open_meteo
  # Open-Meteo needs no API key. We pull temperature, heat index, and
  # precipitation — the drivers behind heat stress, cold, and asthma ED visits.
  base_url: https://api.open-meteo.com/v1/forecast
  variables:
    - temperature_2m
    - apparent_temperature
    - precipitation

events:
  # Manual CSV is always loaded as a baseline. Ticketmaster and Eventbrite
  # augment it automatically when their keys are present. All three sources
  # are merged and deduplicated in the provider.
  manual_csv:
    path: data/boston_events.csv

  ticketmaster:
    base_url: https://app.ticketmaster.com/discovery/v2
    city: Boston
    state_code: MA
    # classificationName accepts comma-separated values; both Sports and Music
    # are fetched in a single query. The fetcher always queries forward
    # (today → today+365) since the Discovery API only exposes upcoming events.
    segments:
      - Sports
      - Music

  civic_events:
    # Boston.gov publishes its event calendar through a Drupal JSON:API endpoint.
    # No API key required. Covers civic gatherings Ticketmaster misses:
    # marathons, festivals, parades, community health fairs.
    base_url: https://www.boston.gov

  venues:
    - TD Garden
    - Fenway Park
    - Boston Convention and Exhibition Center
    - Gillette Stadium   # outside the core but draws regional flow

academic_calendar:
  # Boston's population swells by ~150K students each fall/spring semester —
  # a population-flow driver with a textbook link to respiratory illness
  # ("school back in session -> ILI ticks up a couple weeks later"). There is
  # no API for term dates (schools publish PDFs/HTML that change yearly), so
  # this is a hand-curated reference CSV — refresh it ~once a year by copying
  # each school's start/end dates from its registrar calendar page.
  manual_csv:
    path: data/boston_academic_calendar.csv
  # Days to linearly ramp the "in session" weight up at move-in and down at
  # move-out, instead of stepping abruptly — smooths the population transition
  # the way it actually happens.
  ramp_days: 7

wastewater:
  # Wastewater viral surveillance — the strongest LEADING indicator for the
  # "disease" sub-hypothesis. Virus shed in stool appears in sewage ~4–10 days
  # before the matching clinical/hospital surge, so we expect a positive lead
  # lag against hospital demand. Multi-pathogen: SARS-CoV-2 (metro-Boston via
  # MWRA), plus Influenza A and RSV (Massachusetts via CDC NWSS).
  provider: mwra_cdc_nwss
  pathogens:
    - SARS-CoV-2
    - Influenza A
    - RSV

  # Primary (SARS-CoV-2 only): MWRA Deer Island, analyzed by Biobot — the
  # metro-Boston gold standard (~2.3M-person sewershed). MWRA's public feed is
  # COVID-only; flu/RSV for the metro area flow through WastewaterSCAN instead,
  # which has no stable open API, so those come from CDC NWSS below. The exact
  # machine-readable URL has moved over time — set data_url to the current CSV
  # export; the fetcher auto-discovers the date/concentration columns and
  # degrades to CDC NWSS if it can't read it.
  mwra:
    base_url: https://www.mwra.com/biobot/biobotdata.htm
    # data_url: http://ftp.mwra.com/biobot/<current-export>.csv   # set in production

  # Fallback / multi-pathogen: CDC National Wastewater Surveillance System
  # "Wastewater Viral Activity Level" (SARS-CoV-2, Influenza A, RSV). Socrata
  # API, no key. Statewide Massachusetts values; the fetcher filters by state
  # and auto-discovers the date/pathogen/value fields (long or wide layout).
  cdc_nwss:
    base_url: https://data.cdc.gov/resource/atcp-73re.json
    state: Massachusetts

# --- Hospital-demand signal (the dependent variable) ------------------------

hospital_demand:
  # Three-tier fallback: MA DPH manual CSV → CDC FluView ILINet → sample data.
  # CDC FluView runs automatically with no key; MA DPH gives actual ED counts.
  provider: ma_dph_respiratory
  state: Massachusetts
  dashboard_url: https://www.mass.gov/info-details/weekly-flu-report
  cadence: weekly
  metrics:
    - ed_visits_respiratory
    - hospital_admissions_respiratory
  # Environmental hospitalizations (asthma, heat stress, COPD, CO, MI) directly
  # support the weather/seasonal sub-hypothesis.
  environmental_url: https://www.mass.gov/info-details/environmental-hospitalization-data

hospital_locations:
  # Static reference layer (MassGIS acute care hospitals) for geographic
  # matching of flow signals to nearby EDs.
  provider: massgis
  layer: acute_care_hospitals

# --- Analysis defaults -------------------------------------------------------

analysis:
  # Common resolution everything is aggregated/resampled to. Weekly is forced by
  # the hospital data; daily is available for the flow signals and used in
  # Phase 2 event studies.
  base_resolution: weekly
  # Lag windows (in days) to scan for each sub-hypothesis in cross-correlation.
  lag_windows:
    large_gatherings: [0, 3]
    weather: [0, 5]
    disease: [0, 14]
    commute: [0, 1]
